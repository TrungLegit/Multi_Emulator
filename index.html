<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi_Emulator — Educational ADR Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .badge-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>
  <main>
    <h1>Multi_Emulator</h1>
    <p>Multi Emulator ADR version for education.</p>
    <div class="badge-list">
      <span class="badge">Python</span>
      <span class="badge">Node.js</span>
      <span class="badge">HTML5</span>
    </div>
  </main>
</body>
</html>
