<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi_Emulator — Connector & Sync Hub Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #26354d;
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.65rem;
      color: var(--accent);
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 0.25rem;
    }
    .toolbar {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      transition: all 0.15s ease;
    }
    button:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    button.primary:hover {
      opacity: 0.92;
    }
    button.danger {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 1.65rem;
      font-weight: 700;
      margin-top: 0.35rem;
    }
    .sync-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .sync-bar input {
      flex: 1;
      min-width: 240px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .emu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .emu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .emu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .emu-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .emu-meta {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.SYNCED, .badge.CONNECTED {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .badge.DISCOVERED, .badge.DISCONNECTED {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .log-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #cbd5e1;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Multi_Emulator Connector Hub</h1>
        <p class="subtitle">Scan, Connect & Synchronize Emulator Instances (Educational ADR Edition)</p>
      </div>
      <div class="toolbar">
        <button onclick="scanEmulators()">1. Scan Emulators</button>
        <button class="primary" onclick="connectAllEmulators()">2. Connect & Link All</button>
        <button class="danger" onclick="disconnectAllEmulators()">Disconnect All</button>
      </div>
    </header>

    <section class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">Discovered Emulators</div>
        <div class="stat-value" id="stat-discovered">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Connected</div>
        <div class="stat-value" id="stat-connected">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Linked in Sync Hub</div>
        <div class="stat-value" id="stat-synced">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Sync Groups</div>
        <div class="stat-value" id="stat-groups">0</div>
      </div>
    </section>

    <section class="sync-bar">
      <strong>Sync Broadcast:</strong>
      <input id="sync-cmd" type="text" value="input tap 540 960" placeholder="Enter ADB / Sync command (e.g. input tap 540 960)" />
      <button class="primary" onclick="broadcastCommand()">Send to Linked Emulators</button>
    </section>

    <section class="emu-grid" id="emu-grid"></section>

    <section>
      <div class="stat-label" style="margin-bottom: 0.5rem;">Connector Activity Log</div>
      <div class="log-box" id="log-box">Ready. Click "1. Scan Emulators" to discover instances.</div>
    </section>
  </div>

  <script>
    function appendLog(msg) {
      const box = document.getElementById("log-box");
      const ts = new Date().toLocaleTimeString();
      box.textContent = `[${ts}] ${msg}\n` + box.textContent;
    }

    function renderState(data) {
      const summary = data.summary || {};
      document.getElementById("stat-discovered").textContent = summary.discoveredCount ?? 0;
      document.getElementById("stat-connected").textContent = summary.connectedCount ?? 0;
      document.getElementById("stat-synced").textContent = summary.syncedCount ?? 0;
      document.getElementById("stat-groups").textContent = summary.activeSyncGroups ?? 0;

      const grid = document.getElementById("emu-grid");
      const instances = data.instances || [];
      if (!instances.length) {
        grid.innerHTML = `<div class="emu-card"><p class="emu-meta">No emulators scanned yet.</p></div>`;
        return;
      }

      grid.innerHTML = instances.map((inst) => `
        <div class="emu-card">
          <div class="emu-header">
            <div>
              <div class="emu-title">${inst.name} ${inst.isMaster ? "👑" : ""}</div>
              <div class="emu-meta">ID: ${inst.id} • Endpoint: ${inst.host}:${inst.port} (${inst.source})</div>
            </div>
            <span class="badge ${inst.connectionState}">${inst.connectionState}</span>
          </div>
          <div class="emu-meta">
            Sync Hub: <strong>${inst.syncGroupId || "Not Linked"}</strong><br/>
            CPU: ${inst.metrics.cpuPercent}% | RAM: ${inst.metrics.ramUsageMb} MB | FPS: ${inst.metrics.fps}<br/>
            Note: ${inst.lastMessage || "-"}
          </div>
          <div class="toolbar">
            <button onclick="connectOne('${inst.id}')">Connect</button>
            <button onclick="disconnectOne('${inst.id}')">Disconnect</button>
          </div>
        </div>
      `).join("");
    }

    async function scanEmulators() {
      appendLog("Scanning for available emulators (ADB + Local TCP Ports + Mock fallback)...");
      const res = await fetch("/api/connector/scan", { method: "POST" });
      const data = await res.json();
      renderState(data);
      appendLog(`Scan complete: found ${data.summary?.discoveredCount || 0} emulator(s).`);
    }

    async function connectAllEmulators() {
      appendLog("Connecting all discovered emulators and linking into Primary Sync Hub...");
      const res = await fetch("/api/connector/connect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ autoLink: true }),
      });
      const data = await res.json();
      renderState(data);
      appendLog(`Connected & Linked ${data.summary?.syncedCount || 0} emulator(s) together.`);
    }

    async function connectOne(instanceId) {
      appendLog(`Connecting to ${instanceId}...`);
      const res = await fetch("/api/connector/connect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ instanceId }),
      });
      const data = await res.json();
      renderState(data);
      appendLog(`Connected ${instanceId}.`);
    }

    async function disconnectOne(instanceId) {
      appendLog(`Disconnecting ${instanceId}...`);
      const res = await fetch("/api/connector/disconnect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ instanceId }),
      });
      const data = await res.json();
      renderState(data);
      appendLog(`Disconnected ${instanceId}.`);
    }

    async function disconnectAllEmulators() {
      appendLog("Disconnecting all emulators...");
      const res = await fetch("/api/connector/disconnect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      renderState(data);
      appendLog("All emulators disconnected.");
    }

    async function broadcastCommand() {
      const cmd = document.getElementById("sync-cmd").value.trim();
      if (!cmd) return;
      appendLog(`Broadcasting command "${cmd}" to all linked emulators...`);
      const res = await fetch("/api/connector/broadcast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd }),
      });
      const data = await res.json();
      if (data.error) {
        appendLog(`Error: ${data.error}`);
        return;
      }
      renderState(data);
      const outputs = (data.broadcast?.results || []).map((r) => `${r.instanceId}: ${r.output}`).join(" | ");
      appendLog(`Broadcast complete (${data.broadcast?.targetCount || 0} targets) -> ${outputs}`);
    }

    // Load initial status on page open
    fetch("/api/connector/status").then((r) => r.json()).then(renderState).catch(() => {});
  </script>
</body>
</html>
